<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="#111827" name="theme-color"/>
<meta content="yes" name="mobile-web-app-capable"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/>
<meta content="ATL Lab Manager" name="apple-mobile-web-app-title"/>
<link href="./manifest.webmanifest" rel="manifest"/>
<link href="./icons/icon-192.png" rel="icon" sizes="192x192" type="image/png"/>
<link href="./icons/icon-192.png" rel="apple-touch-icon"/>
<title>ATL Lab Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#f4f6fb;
  --card:#fff;
  --text:#172033;
  --muted:#718096;
  --primary:#4f46e5;
  --primary2:#4338ca;
  --border:#e5e9f2;
  --danger:#dc2626;
  --green:#059669;
  --sidebar:#111827;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}

.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#111827,#312e81)}
.login-card{width:100%;max-width:420px;background:white;padding:34px;border-radius:20px;box-shadow:0 20px 60px #0004}
.logo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:#4f46e5;color:white;font-size:23px;font-weight:800}
.login-card h1{margin:16px 0 5px}
.login-card p{color:#718096}

.field{margin:14px 0}
.field label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:9px;background:white;outline:none;color:#172033}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #4f46e51a}
.field input:disabled{background:#f3f4f6;color:#64748b}

.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:650;background:#eef0f7;color:#263047}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);color:white}
.btn-primary:hover{background:var(--primary2)}
.btn-danger{background:#fee2e2;color:#b91c1c}
.btn-success{background:#d1fae5;color:#047857}
.btn-outline{background:white;border:1px solid var(--border)}
.btn-block{width:100%}
.error{color:#dc2626;font-size:13px;margin-top:10px}
.success{color:#059669;font-size:13px;margin-top:10px}

.app{min-height:100vh;display:flex}
.sidebar{width:245px;background:var(--sidebar);color:white;padding:22px 15px;display:flex;flex-direction:column;flex-shrink:0}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 25px}
.brand-icon{width:40px;height:40px;border-radius:12px;background:#4f46e5;display:grid;place-items:center;font-weight:800;font-size:18px}
.brand strong{display:block}
.brand small{color:#9ca3af}
.nav-label{color:#9ca3af;font-size:10px;letter-spacing:1.3px;padding:15px 10px 8px}
.nav-btn{width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;margin:2px 0;border:0;border-radius:9px;color:#cbd5e1;background:transparent;text-align:left;font-size:14px}
.nav-btn:hover,.nav-btn.active{background:#312e81;color:white}
.nav-icon{width:20px;text-align:center}
.sidebar-bottom{margin-top:auto;padding-top:20px}
.main{flex:1;min-width:0}
.topbar{height:70px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.topbar-right{display:flex;align-items:center;gap:12px}
.role-pill{background:#eef2ff;color:#4338ca;border-radius:30px;padding:6px 11px;font-size:12px;font-weight:700}
.content{padding:28px;max-width:1400px;margin:auto}
.page-heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px;flex-wrap:wrap}
.page-heading h1{margin:0 0 5px;font-size:25px}
.page-heading p{margin:0;color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
.stat-card,.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:19px}
.stat-title{font-size:13px;color:var(--muted)}
.stat-number{font-size:29px;font-weight:800;margin-top:10px}
.stat-icon{width:37px;height:37px;border-radius:10px;background:#eef2ff;display:grid;place-items:center}
.stat-top{display:flex;justify-content:space-between;align-items:center}
.panel{margin-bottom:18px}
.panel h3{margin:0 0 15px;font-size:16px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}
.search{flex:1;min-width:180px}
.search input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:9px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:13px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{color:var(--muted);font-weight:650;background:#fafbfe}
td{vertical-align:middle}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions .btn{padding:7px 9px;font-size:12px}
.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef2ff;color:#4338ca;font-size:11px;font-weight:650}
.empty{padding:35px;text-align:center;color:var(--muted)}

.stock-good{background:#d1fae5;color:#047857}
.stock-low{background:#fef3c7;color:#92400e}
.stock-out{background:#fee2e2;color:#b91c1c}
.status-issued{background:#dbeafe;color:#1d4ed8}
.status-partial{background:#fef3c7;color:#92400e}
.status-returned{background:#d1fae5;color:#047857}

.modal-backdrop{position:fixed;inset:0;background:#11182788;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{width:100%;max-width:600px;max-height:90vh;overflow:auto;background:white;border-radius:16px;padding:23px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head h2{margin:0;font-size:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.notice{padding:12px 14px;border-radius:9px;background:#eff6ff;color:#1d4ed8;font-size:13px;margin-bottom:15px}
.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:white;padding:13px 18px;border-radius:10px;z-index:130;box-shadow:0 5px 20px #0003}
.mobile-menu{display:none}

.dialog-backdrop{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.65);display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(4px)}
.dialog-box{width:100%;max-width:430px;background:white;border-radius:18px;padding:25px;box-shadow:0 25px 70px #0004;animation:dialogAppear .2s ease}
@keyframes dialogAppear{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.dialog-icon{width:45px;height:45px;display:grid;place-items:center;border-radius:13px;background:#eef2ff;color:#4f46e5;font-size:22px;margin-bottom:15px}
.dialog-box h2{margin:0 0 9px;font-size:20px}
.dialog-box p{color:#718096;font-size:14px;line-height:1.6;white-space:pre-line}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}

.csv-file{padding:20px;border:2px dashed #c7d2fe;background:#f8faff;border-radius:12px;text-align:center}
#csvDropZone{border:2px dashed #a5b4fc;background:#f8faff;border-radius:14px;padding:28px;text-align:center;transition:.2s}
#csvDropZone.dragover{background:#eef2ff;border-color:#4f46e5;transform:scale(1.01)}
#csvSelectedName{margin:14px 0;font-weight:700;color:#4338ca;overflow-wrap:anywhere}
#chooseCsvButton{margin-top:10px}
#csvFile{display:none}
.csv-preview{max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:10px;margin-top:15px}
.csv-preview table{min-width:850px}
.csv-preview th,.csv-preview td{padding:9px;font-size:12px}
.csv-status{margin-top:12px;font-size:13px;white-space:pre-line;line-height:1.6}
.csv-good{color:#047857}
.csv-bad{color:#b91c1c}

.project-status{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#eef2ff;color:#4338ca}
.status-completed{background:#d1fae5;color:#047857}
.status-on-hold{background:#fef3c7;color:#92400e}
.status-cancelled{background:#fee2e2;color:#b91c1c}
.project-description{white-space:pre-wrap;overflow-wrap:anywhere}
/* COMPONENTS AND ISSUE / RETURN */
.stock-low{background:#fee2e2;color:#b91c1c}
.stock-good{background:#d1fae5;color:#047857}
.stock-out{background:#fef3c7;color:#92400e}
.module-form{background:#f8faff;border:1px solid var(--border);padding:17px;border-radius:12px;margin-bottom:18px}
.module-form h3{margin:0 0 10px}
.module-form .form-grid{gap:0 14px}
.return-box{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.return-box input{width:85px;padding:7px;border:1px solid var(--border);border-radius:7px}
@media(max-width:950px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){
  .sidebar{position:fixed;z-index:20;left:-260px;top:0;bottom:0;transition:left .2s}
  .sidebar.open{left:0}
  .mobile-menu{display:inline-block}
  .topbar{padding:0 14px}
  .content{padding:18px 13px}
  .cards{gap:10px}
  .stat-card{padding:14px}
  .stat-number{font-size:24px}
  .form-grid{grid-template-columns:1fr}
}

/* CUSTOM PRINTING PAYMENT WINDOW */
.payment-modal-backdrop{position:fixed;inset:0;z-index:1200;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(15,23,42,.62);backdrop-filter:blur(5px)}
.payment-modal{width:100%;max-width:500px;background:#fff;border:1px solid #e5e9f2;border-radius:20px;padding:25px;box-shadow:0 28px 90px #0f172a55;animation:dialogAppear .18s ease;max-height:calc(100vh - 36px);overflow:auto}
.payment-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}
.payment-modal-head h2{margin:0 0 5px;font-size:21px;color:#172033}
.payment-modal-head p{margin:0;color:#718096;font-size:13px}
.payment-modal-close{border:0;background:#f1f5f9;color:#475569;border-radius:10px;width:36px;height:36px;font-size:20px}
.payment-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:16px 0 20px}
.payment-summary-card{background:#f8fafc;border:1px solid #e8edf5;border-radius:12px;padding:12px 10px;min-width:0}
.payment-summary-card span{display:block;color:#64748b;font-size:11px;margin-bottom:5px}
.payment-summary-card strong{display:block;color:#172033;font-size:15px;overflow-wrap:anywhere}
.payment-modal .field{margin:13px 0}
.payment-modal .field input,.payment-modal .field select{min-height:45px}
.payment-modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.payment-modal-error{color:#dc2626;font-size:13px;min-height:18px;margin-top:8px}
@media(max-width:430px){.payment-modal{padding:19px}.payment-summary{gap:6px}.payment-summary-card{padding:10px 7px}.payment-summary-card strong{font-size:13px}}


/* =========================================================
   3D PRINTING STUDIO — CLEAN, MODERN WORKSPACE STYLING
   Presentation only: existing IDs, events and data logic stay intact.
========================================================= */
.printing-create-panel,.printing-jobs-panel{border:1px solid #e4e9f3;border-radius:18px;padding:22px;background:linear-gradient(180deg,#fff 0%,#fcfdff 100%);box-shadow:0 8px 24px rgba(28,42,74,.045)}
.printing-section-heading,.printing-list-heading{display:flex;align-items:center;gap:13px;margin-bottom:18px}
.printing-section-heading h3,.printing-list-heading h3{margin:0 0 4px;font-size:17px;font-weight:750;letter-spacing:-.02em;color:#17243b}
.printing-section-heading p,.printing-list-heading p{margin:0;color:#8190a7;font-size:12px}
.printing-heading-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#e9edff,#f1edff);color:#4f46e5;font-size:25px;font-weight:500}
.printing-create-panel .module-form,.printing-create-panel form{margin-top:3px}
.printing-create-panel .field label{color:#53627a;font-size:12px;font-weight:700}
.printing-create-panel .field input,.printing-create-panel .field select,.printing-create-panel .field textarea{border-radius:11px;border-color:#dfe6f1;background:#fff;min-height:43px;transition:border-color .18s,box-shadow .18s}
.printing-create-panel .field input:focus,.printing-create-panel .field select:focus,.printing-create-panel .field textarea:focus{border-color:#818cf8;box-shadow:0 0 0 4px rgba(99,102,241,.10)}
#printingJobForm .notice,#pjEstimate{border:1px solid #dfe7ff;background:#f5f7ff;color:#4657a5;border-radius:12px;padding:13px 15px;font-weight:650}
#printingJobForm #savePrintingJob{min-height:42px;padding:0 19px;border-radius:11px;box-shadow:0 5px 12px rgba(79,70,229,.18)}
.printing-list-heading{justify-content:space-between;align-items:center;margin-bottom:17px}
.printing-record-label{font-size:10px;font-weight:800;letter-spacing:.09em;color:#6675bb;background:#f0f2ff;border:1px solid #e2e6ff;padding:7px 10px;border-radius:30px;white-space:nowrap}
.printing-toolbar{padding:11px;background:#f7f9fd;border:1px solid #edf0f6;border-radius:13px;margin-bottom:15px}
.printing-toolbar .search input{height:43px;padding:0 14px;border:1px solid #e0e6f0;border-radius:10px;background:#fff;color:#25334b;box-shadow:0 1px 2px rgba(15,23,42,.02)}
.printing-toolbar .search input:focus{outline:none;border-color:#818cf8;box-shadow:0 0 0 3px rgba(99,102,241,.10)}
#printingStatusFilter{height:43px;min-width:132px;padding:0 32px 0 12px;border:1px solid #e0e6f0;border-radius:10px;background:#fff;color:#334155;font-size:13px}
.printing-table-wrap{border:1px solid #e9edf4;border-radius:13px;overflow:auto;background:#fff}
.printing-jobs-table{width:100%;min-width:980px;border-collapse:separate;border-spacing:0}
.printing-jobs-table th{position:sticky;top:0;z-index:1;padding:14px 12px;background:#f7f8fc;color:#697891;border-bottom:1px solid #e7ebf3;font-size:11px;font-weight:800;letter-spacing:.035em;text-transform:uppercase;white-space:nowrap}
.printing-jobs-table td{padding:15px 12px;border-bottom:1px solid #edf0f5;color:#394860;font-size:12px;white-space:nowrap}
.printing-jobs-table tbody tr{transition:background .15s}
.printing-jobs-table tbody tr:hover{background:#f8faff}
.printing-jobs-table tbody tr:last-child td{border-bottom:0}
.printing-jobs-table td:first-child strong{display:inline-flex;align-items:center;justify-content:center;min-width:76px;padding:7px 9px;border-radius:9px;background:#f0f2ff;color:#4855a7;font-size:11px;letter-spacing:.02em}
.printing-jobs-table td:nth-child(6){font-weight:750;color:#26364f}
.printing-jobs-table td:nth-child(7){font-weight:700;color:#07845e}
.printing-jobs-table td:nth-child(8){font-weight:750;color:#c07816}
.printing-jobs-table .tag{padding:6px 10px;border-radius:30px;background:#eef2ff;color:#4f46e5;font-size:10px;font-weight:800;white-space:nowrap}
.printing-jobs-table .actions{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.printing-jobs-table .actions .btn{min-height:32px;padding:6px 10px;border-radius:9px;font-size:11px;font-weight:750;white-space:nowrap;transition:transform .15s,box-shadow .15s}
.printing-jobs-table .actions .btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(15,23,42,.08)}
.printing-jobs-table .actions .btn-success{background:#dcfceE;color:#087b57}
.printing-jobs-table .actions .btn-outline{border-color:#dce3ee;color:#52627a}
.printing-jobs-table .actions .btn-danger{background:#fff0f0;color:#c24141}
.printing-jobs-table .actions .btn:disabled{opacity:.45;transform:none;box-shadow:none}
.printing-jobs-table .empty{padding:38px 15px;color:#8290a5;font-size:13px}
@media(max-width:700px){.printing-create-panel,.printing-jobs-panel{padding:15px;border-radius:14px}.printing-list-heading{align-items:flex-start}.printing-record-label{font-size:9px}.printing-toolbar{align-items:stretch}.printing-toolbar .search{flex-basis:100%}#printingStatusFilter{width:100%}.printing-section-heading p,.printing-list-heading p{line-height:1.5}}

/* Audit hardening and accessibility */
:focus-visible{outline:3px solid rgba(79,70,229,.55);outline-offset:2px}
button:disabled{pointer-events:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:700px){.content{padding:16px 12px}.page-heading h1{font-size:21px}.toolbar>.btn{flex:1 1 auto}.modal{max-height:calc(100dvh - 24px);padding:16px}.modal-actions{flex-wrap:wrap}.modal-actions .btn{flex:1}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}



/* ATL LAB MANAGER — PROFESSIONAL UI THEME
   Visual-only CSS overrides. Existing HTML IDs, JavaScript, Supabase calls,
   event handlers, forms and application workflows are intentionally untouched. */
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --text: #172338;
  --muted: #748198;
  --primary: #315ee8;
  --primary2: #254bd0;
  --border: #e4eaf3;
  --danger: #d94353;
  --green: #078568;
  --sidebar: #101a2d;
  --surface-soft: #f7f9fd;
  --shadow-sm: 0 2px 8px rgba(24, 39, 75, .045);
  --shadow-md: 0 12px 30px rgba(24, 39, 75, .075);
  --shadow-lg: 0 24px 70px rgba(14, 25, 48, .18);
  --radius-card: 17px;
  --radius-control: 11px;
}

html { min-height: 100%; scroll-behavior: smooth; }
body {
  min-height: 100vh;
